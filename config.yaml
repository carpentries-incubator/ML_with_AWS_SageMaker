#------------------------------------------------------------

# Which carpentry is this (swc, dc, lc, or cp)?
# swc: Software Carpentry
# dc: Data Carpentry
# lc: Library Carpentry
# cp: Carpentries (to use for instructor training for instance)
# incubator: The Carpentries Incubator
# 
# This option supports custom types so lessons can be branded
# and themed with your own logo and alt-text (see `carpentry_description`)
# See https://carpentries.github.io/sandpaper-docs/editing.html#adding-a-custom-logo
carpentry: 'incubator'

# Alt-text description of the lesson.
carpentry_description: 'Learn to run machine learning workflows on AWS without losing control of the bill: SageMaker notebooks as controllers, training and hyperparameter-tuning jobs, retrieval-augmented generation on Amazon Bedrock and on rented GPUs, and fine-tuning an open-weight vision-language model. Developed for the UW-Madison Machine Learning Marathon and Research Bazaar; some setup steps refer to the shared workshop account.'

# Overall title for pages.
title: 'Machine Learning with Amazon SageMaker'

# Date the lesson was created (YYYY-MM-DD, this is empty by default)
created: 2024-10-31

# Comma-separated list of keywords for the lesson
keywords: 'AWS, SageMaker, Bedrock, Cloud Computing, Machine Learning, AI, RAG, Fine-tuning, Cost Management'

# Life cycle stage of the lesson
# possible values: pre-alpha, alpha, beta, stable
life_cycle: 'alpha' 

# License of the lesson
license: 'CC-BY 4.0'

# Link to the source repository for this lesson
source: 'https://github.com/carpentries-incubator/ML_with_AWS_SageMaker'


# Default branch of your lesson
branch: 'main'

# Who to contact if there are any issues
contact: 'endemann@wisc.edu' 

