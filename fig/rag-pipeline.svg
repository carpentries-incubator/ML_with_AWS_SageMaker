<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-weight="bold" font-size="16">Retrieval-augmented generation: one pipeline, two model calls</text>

  <!-- index-time row -->
  <text x="40" y="70" font-size="12" fill="#666">Once, per corpus</text>
  <rect x="40"  y="80" width="120" height="50" rx="6" fill="#f2f2f2" stroke="#888"/>
  <text x="100" y="101" text-anchor="middle" font-size="12">PDFs</text>
  <text x="100" y="117" text-anchor="middle" font-size="11">(shared bucket)</text>
  <line x1="160" y1="105" x2="200" y2="105" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="80" width="120" height="50" rx="6" fill="#f2f2f2" stroke="#888"/>
  <text x="260" y="101" text-anchor="middle" font-size="12">text chunks</text>
  <text x="260" y="117" text-anchor="middle" font-size="11">chunks.jsonl</text>
  <line x1="320" y1="105" x2="360" y2="105" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="75" width="150" height="60" rx="6" fill="#f3e8fd" stroke="#7a3fb5" stroke-width="2.5"/>
  <text x="435" y="97" text-anchor="middle" font-weight="bold" font-size="12">EMBEDDER</text>
  <text x="435" y="113" text-anchor="middle" font-size="11">model call 1</text>
  <text x="435" y="127" text-anchor="middle" font-size="10">text -> vector</text>
  <line x1="510" y1="105" x2="550" y2="105" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="80" width="130" height="50" rx="6" fill="#fff4e0" stroke="#d9931f"/>
  <text x="615" y="101" text-anchor="middle" font-size="12">embedding matrix</text>
  <text x="615" y="117" text-anchor="middle" font-size="11">one vector per chunk</text>

  <!-- query-time row -->
  <text x="40" y="200" font-size="12" fill="#666">Per question</text>
  <rect x="40"  y="210" width="120" height="50" rx="6" fill="#f2f2f2" stroke="#888"/>
  <text x="100" y="240" text-anchor="middle" font-size="12">question</text>
  <line x1="160" y1="235" x2="360" y2="235" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="205" width="150" height="60" rx="6" fill="#f3e8fd" stroke="#7a3fb5" stroke-width="2.5"/>
  <text x="435" y="227" text-anchor="middle" font-weight="bold" font-size="12">EMBEDDER</text>
  <text x="435" y="243" text-anchor="middle" font-size="11">same model</text>
  <text x="435" y="257" text-anchor="middle" font-size="10">question -> vector</text>
  <line x1="510" y1="235" x2="550" y2="235" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="210" width="130" height="50" rx="6" fill="#e9f7ec" stroke="#2e8b57"/>
  <text x="615" y="231" text-anchor="middle" font-size="12">retrieve top-k</text>
  <text x="615" y="247" text-anchor="middle" font-size="11">cosine similarity</text>
  <line x1="615" y1="130" x2="615" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="235" x2="720" y2="235" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="720" y="205" width="150" height="60" rx="6" fill="#f3e8fd" stroke="#7a3fb5" stroke-width="2.5"/>
  <text x="795" y="227" text-anchor="middle" font-weight="bold" font-size="12">GENERATOR</text>
  <text x="795" y="243" text-anchor="middle" font-size="11">model call 2 (LLM)</text>
  <text x="795" y="257" text-anchor="middle" font-size="10">prompt = question + chunks</text>
  <line x1="870" y1="235" x2="905" y2="235" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="930" y="240" text-anchor="middle" font-size="12">answer</text>

  <!-- swap legend -->
  <rect x="40" y="300" width="14" height="14" fill="#f3e8fd" stroke="#7a3fb5" stroke-width="2.5"/>
  <text x="62" y="312" font-size="12" fill="#333">The two purple boxes are the only parts that change between episodes. Everything else is plain Python.</text>
  <text x="62" y="334" font-size="12" fill="#333">Bedrock: Titan embeddings + DeepSeek V3, per token.   Processing jobs / GPU notebook: sentence-transformer + Qwen3.8-27B on a rented GPU.</text>
</svg>
