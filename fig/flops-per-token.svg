<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="1100" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arx" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bbb"/></marker>
  </defs>
  <text x="550" y="34" text-anchor="middle" font-weight="bold" font-size="22">Floating-point operations per weight, per token: three matrix products</text>
  <text x="550" y="58" text-anchor="middle" font-size="15" fill="#555">each product is one multiply and one add per weight = 2 FLOPs</text>

  <!-- the layer -->
  <rect x="440" y="150" width="220" height="150" fill="#9ecae1" stroke="#444" stroke-width="1.5"/>
  <text x="550" y="215" text-anchor="middle" font-weight="bold" font-size="30">W</text>
  <text x="550" y="245" text-anchor="middle" font-size="15">one layer's weights</text>

  <!-- 1. forward: x in from left, y out to right -->
  <line x1="120" y1="190" x2="436" y2="190" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="128" y="180" font-size="15">input x</text>
  <line x1="664" y1="190" x2="980" y2="190" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="870" y="180" font-size="15">output W·x</text>
  <rect x="150" y="100" width="260" height="34" rx="6" fill="#fff" stroke="#444"/>
  <text x="280" y="123" text-anchor="middle" font-weight="bold">1. Forward: W · x = 2 FLOPs</text>
  <line x1="280" y1="134" x2="280" y2="186" stroke="#444" stroke-dasharray="3 3"/>

  <!-- 2. backward to inputs: error comes from right, goes left -->
  <line x1="980" y1="260" x2="664" y2="260" stroke="#e6550d" stroke-width="2" marker-end="url(#ar)"/>
  <text x="840" y="282" font-size="15" fill="#e6550d">error from the layer above</text>
  <line x1="436" y1="260" x2="120" y2="260" stroke="#e6550d" stroke-width="2" marker-end="url(#ar)"/>
  <text x="128" y="282" font-size="15" fill="#e6550d">error passed down: Wᵀ · error</text>
  <rect x="150" y="330" width="260" height="34" rx="6" fill="#fff" stroke="#e6550d"/>
  <text x="280" y="353" text-anchor="middle" font-weight="bold" fill="#e6550d">2. Back to inputs = 2 FLOPs</text>
  <line x1="280" y1="330" x2="280" y2="266" stroke="#e6550d" stroke-dasharray="3 3"/>

  <!-- 3. weight update: arrow into W from below -->
  <line x1="550" y1="400" x2="550" y2="306" stroke="#a50f15" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="410" y="400" width="280" height="34" rx="6" fill="#fff" stroke="#a50f15"/>
  <text x="550" y="423" text-anchor="middle" font-weight="bold" fill="#a50f15">3. Update W: error · xᵀ = 2 FLOPs</text>

  <!-- totals -->
  <rect x="740" y="320" width="340" height="150" rx="8" fill="#f7f7f7" stroke="#444"/>
  <text x="760" y="350" font-weight="bold" font-size="17">Full fine-tune: 1 + 2 + 3 = 6 FLOPs</text>
  <text x="760" y="374" font-size="15">every weight is updated</text>
  <text x="760" y="410" font-weight="bold" font-size="17">LoRA: 1 + 2 = 4 FLOPs</text>
  <text x="760" y="434" font-size="15">W is frozen, so step 3 is skipped for it;</text>
  <text x="760" y="454" font-size="15">the error still passes down to reach the adapters</text>
</svg>
