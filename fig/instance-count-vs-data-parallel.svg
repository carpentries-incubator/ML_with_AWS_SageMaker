<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="400" fill="#ffffff"/>
  <!-- left panel -->
  <text x="240" y="30" text-anchor="middle" font-weight="bold" font-size="16">instance_count=2, nothing else</text>
  <text x="240" y="50" text-anchor="middle" font-size="12">(described, not run: nobody wants this job)</text>
  <rect x="150" y="70" width="180" height="40" rx="6" fill="#fff4e0" stroke="#d9931f" stroke-width="2"/>
  <text x="240" y="95" text-anchor="middle" font-size="13">S3: full training set</text>
  <line x1="200" y1="110" x2="130" y2="160" stroke="#444" stroke-width="1.5"/>
  <line x1="280" y1="110" x2="350" y2="160" stroke="#444" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="end" font-size="11">full copy</text>
  <text x="340" y="140" font-size="11">full copy</text>
  <rect x="40"  y="160" width="180" height="110" rx="6" fill="#e9f7ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="130" y="185" text-anchor="middle" font-weight="bold" font-size="13">Instance 1</text>
  <text x="130" y="207" text-anchor="middle" font-size="12">runs the whole script</text>
  <text x="130" y="225" text-anchor="middle" font-size="12">on all 569 rows</text>
  <text x="130" y="243" text-anchor="middle" font-size="12">1000 epochs</text>
  <rect x="260" y="160" width="180" height="110" rx="6" fill="#e9f7ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" font-weight="bold" font-size="13">Instance 2</text>
  <text x="350" y="207" text-anchor="middle" font-size="12">runs the whole script</text>
  <text x="350" y="225" text-anchor="middle" font-size="12">on all 569 rows</text>
  <text x="350" y="243" text-anchor="middle" font-size="12">1000 epochs</text>
  <text x="240" y="300" text-anchor="middle" font-size="12">no communication between them</text>
  <text x="240" y="330" text-anchor="middle" font-weight="bold" font-size="13" fill="#b5720f">same model, same time, twice the bill</text>

  <!-- divider -->
  <line x1="480" y1="20" x2="480" y2="380" stroke="#bbb" stroke-dasharray="6,6"/>

  <!-- right panel -->
  <text x="720" y="30" text-anchor="middle" font-weight="bold" font-size="16">Data parallelism</text>
  <text x="720" y="50" text-anchor="middle" font-size="12">(distribution={"mpi": ...} + train_nn_ddp.py: the job this episode runs)</text>
  <rect x="630" y="70" width="180" height="40" rx="6" fill="#fff4e0" stroke="#d9931f" stroke-width="2"/>
  <text x="720" y="95" text-anchor="middle" font-size="13">S3: full training set</text>
  <line x1="680" y1="110" x2="610" y2="160" stroke="#444" stroke-width="1.5"/>
  <line x1="760" y1="110" x2="830" y2="160" stroke="#444" stroke-width="1.5"/>
  <text x="620" y="140" text-anchor="end" font-size="11">rows 0, 2, 4, ...</text>
  <text x="820" y="140" font-size="11">rows 1, 3, 5, ...</text>
  <rect x="520" y="160" width="180" height="110" rx="6" fill="#e9f7ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="610" y="185" text-anchor="middle" font-weight="bold" font-size="13">Instance 1</text>
  <text x="610" y="207" text-anchor="middle" font-size="12">model copy</text>
  <text x="610" y="225" text-anchor="middle" font-size="12">forward/backward on its 285 rows</text>
  <rect x="740" y="160" width="180" height="110" rx="6" fill="#e9f7ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="830" y="185" text-anchor="middle" font-weight="bold" font-size="13">Instance 2</text>
  <text x="830" y="207" text-anchor="middle" font-size="12">model copy</text>
  <text x="830" y="225" text-anchor="middle" font-size="12">forward/backward on its 285 rows</text>
  <line x1="700" y1="250" x2="740" y2="250" stroke="#7a3fb5" stroke-width="2"/>
  <line x1="740" y1="250" x2="700" y2="250" stroke="#7a3fb5" stroke-width="2"/>
  <text x="720" y="243" text-anchor="middle" font-size="10" fill="#7a3fb5">sync gradients</text>
  <text x="720" y="300" text-anchor="middle" font-size="12">every step, both copies end up identical</text>
  <text x="720" y="330" text-anchor="middle" font-weight="bold" font-size="13" fill="#2e8b57">each epoch takes about half as long</text>
  <text x="720" y="350" text-anchor="middle" font-size="11">(minus sync overhead; only pays off when a step is far larger than the sync)</text>
</svg>
