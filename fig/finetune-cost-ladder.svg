<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-weight="bold" font-size="22">What one fine-tuning run costs (log scale)</text>
  <text x="500" y="58" text-anchor="middle" font-size="15" fill="#555">SageMaker on-demand, us-east-1, October 2026. Lighter extension: the same run repeated in a 10-run hyperparameter sweep.</text>

  <!-- axis: x from $0.1 (x=330) to $1,000,000 (x=960); 90 px per decade -->
  <line x1="330" y1="420" x2="960" y2="420" stroke="#444"/>
  <g font-size="14" text-anchor="middle" fill="#333">
    <line x1="330" y1="420" x2="330" y2="426" stroke="#444"/><text x="330" y="444">$0.10</text>
    <line x1="420" y1="420" x2="420" y2="426" stroke="#444"/><text x="420" y="444">$1</text>
    <line x1="510" y1="420" x2="510" y2="426" stroke="#444"/><text x="510" y="444">$10</text>
    <line x1="600" y1="420" x2="600" y2="426" stroke="#444"/><text x="600" y="444">$100</text>
    <line x1="690" y1="420" x2="690" y2="426" stroke="#444"/><text x="690" y="444">$1,000</text>
    <line x1="780" y1="420" x2="780" y2="426" stroke="#444"/><text x="780" y="444">$10,000</text>
    <line x1="870" y1="420" x2="870" y2="426" stroke="#444"/><text x="870" y="444">$100,000</text>
    <line x1="960" y1="420" x2="960" y2="426" stroke="#444"/><text x="960" y="444">$1 M</text>
  </g>
  <g stroke="#eee">
    <line x1="420" y1="80" x2="420" y2="420"/><line x1="510" y1="80" x2="510" y2="420"/><line x1="600" y1="80" x2="600" y2="420"/>
    <line x1="690" y1="80" x2="690" y2="420"/><line x1="780" y1="80" x2="780" y2="420"/><line x1="870" y1="80" x2="870" y2="420"/>
  </g>

  <!-- bars: x_end = 420 + 90*log10(cost); sweep = +90 -->
  <!-- this episode $0.60 -> 400 -->
  <text x="315" y="105" text-anchor="end" font-weight="bold">This episode: 3B LoRA, 120 pages</text>
  <rect x="330" y="88" width="160" height="24" fill="#fdd0a2" stroke="none"/>
  <rect x="330" y="88" width="70" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="495" y="106" font-weight="bold">$0.60</text>

  <!-- homework $1.05 -> 422 -->
  <text x="315" y="155" text-anchor="end">Homework: 3B LoRA, all 251 pages</text>
  <rect x="330" y="138" width="182" height="24" fill="#fdd0a2"/>
  <rect x="330" y="138" width="92" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="517" y="156">$1.05</text>

  <!-- 7B full $140 -> 613 -->
  <text x="315" y="205" text-anchor="end">7B full fine-tune, 50k docs, 8 × A100</text>
  <rect x="330" y="188" width="373" height="24" fill="#fdd0a2"/>
  <rect x="330" y="188" width="283" height="24" fill="#e6550d" stroke="#444"/>
  <text x="708" y="206" font-weight="bold">$140</text>

  <!-- 70B LoRA $600 -> 670 -->
  <text x="315" y="255" text-anchor="end">70B LoRA, one day, 8 × A100</text>
  <rect x="330" y="238" width="430" height="24" fill="#fdd0a2"/>
  <rect x="330" y="238" width="340" height="24" fill="#e6550d" stroke="#444"/>
  <text x="765" y="256" font-weight="bold">$600</text>

  <!-- CHURRO $6,300 -> 762 -->
  <text x="315" y="305" text-anchor="end">CHURRO-3B training run, 100k pages, 32 × H100</text>
  <rect x="330" y="288" width="522" height="24" fill="#fdd0a2"/>
  <rect x="330" y="288" width="432" height="24" fill="#a50f15" stroke="#444"/>
  <text x="857" y="306" font-weight="bold">$6,300</text>

  <!-- 70B full $12,000 -> 787 -->
  <text x="315" y="355" text-anchor="end">70B full fine-tune, two days, 32 × H100</text>
  <rect x="330" y="338" width="547" height="24" fill="#fdd0a2"/>
  <rect x="330" y="338" width="457" height="24" fill="#a50f15" stroke="#444"/>
  <text x="882" y="356" font-weight="bold">$12,000</text>

  <text x="500" y="485" text-anchor="middle" font-size="15" fill="#333">Each grid line is 10×. The class run and the costliest row are five decades apart; a sweep moves every bar one decade right.</text>
</svg>
