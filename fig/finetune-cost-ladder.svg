<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-weight="bold" font-size="22">What one fine-tuning run costs (log scale)</text>
  <text x="550" y="58" text-anchor="middle" font-size="15" fill="#555">SageMaker on-demand, us-east-1, October 2026. Lighter extension: the same run repeated in a 10-run hyperparameter sweep.</text>
  <line x1="430" y1="460" x2="1060" y2="460" stroke="#444"/>
  <g font-size="14" text-anchor="middle" fill="#333">
    <line x1="430" y1="460" x2="430" y2="466" stroke="#444"/><text x="430" y="484">$0.10</text>
    <line x1="520" y1="460" x2="520" y2="466" stroke="#444"/><text x="520" y="484">$1</text>
    <line x1="610" y1="460" x2="610" y2="466" stroke="#444"/><text x="610" y="484">$10</text>
    <line x1="700" y1="460" x2="700" y2="466" stroke="#444"/><text x="700" y="484">$100</text>
    <line x1="790" y1="460" x2="790" y2="466" stroke="#444"/><text x="790" y="484">$1,000</text>
    <line x1="880" y1="460" x2="880" y2="466" stroke="#444"/><text x="880" y="484">$10,000</text>
    <line x1="970" y1="460" x2="970" y2="466" stroke="#444"/><text x="970" y="484">$100,000</text>
    <line x1="1060" y1="460" x2="1060" y2="466" stroke="#444"/><text x="1060" y="484">$1 M</text>
    </g>
  <g stroke="#eee"><line x1="520" y1="80" x2="520" y2="460"/><line x1="610" y1="80" x2="610" y2="460"/><line x1="700" y1="80" x2="700" y2="460"/><line x1="790" y1="80" x2="790" y2="460"/><line x1="880" y1="80" x2="880" y2="460"/><line x1="970" y1="80" x2="970" y2="460"/></g>
  <text x="415" y="109" text-anchor="end" font-weight="bold">This episode: 3B LoRA, 251 pages, 2 passes</text>
  <rect x="430" y="92" width="178" height="24" fill="#fdd0a2"/>
  <rect x="430" y="92" width="88" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="613" y="110" font-weight="bold">$0.95</text>
  <text x="415" y="157" text-anchor="end">Homework: same pages, 4 passes</text>
  <rect x="430" y="140" width="205" height="24" fill="#fdd0a2"/>
  <rect x="430" y="140" width="115" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="640" y="158">$1.90</text>
  <text x="415" y="205" text-anchor="end">Teams: 3B LoRA, 619 pages, 2 passes</text>
  <rect x="430" y="188" width="212" height="24" fill="#fdd0a2"/>
  <rect x="430" y="188" width="122" height="24" fill="#2b8cbe" stroke="#444" stroke-dasharray="4 3"/>
  <text x="647" y="206">$2.25</text>
  <text x="415" y="253" text-anchor="end">7B full fine-tune, 50k docs, 3 passes</text>
  <rect x="430" y="236" width="373" height="24" fill="#fdd0a2"/>
  <rect x="430" y="236" width="283" height="24" fill="#e6550d" stroke="#444"/>
  <text x="808" y="254" font-weight="bold">$140</text>
  <text x="415" y="301" text-anchor="end">70B LoRA, one day</text>
  <rect x="430" y="284" width="430" height="24" fill="#fdd0a2"/>
  <rect x="430" y="284" width="340" height="24" fill="#e6550d" stroke="#444"/>
  <text x="865" y="302" font-weight="bold">$600</text>
  <text x="415" y="349" text-anchor="end">CHURRO-3B's own training</text>
  <rect x="430" y="332" width="522" height="24" fill="#fdd0a2"/>
  <rect x="430" y="332" width="432" height="24" fill="#a50f15" stroke="#444"/>
  <text x="957" y="350" font-weight="bold">$6,300</text>
  <text x="415" y="397" text-anchor="end">70B full fine-tune, two days</text>
  <rect x="430" y="380" width="547" height="24" fill="#fdd0a2"/>
  <rect x="430" y="380" width="457" height="24" fill="#a50f15" stroke="#444"/>
  <text x="982" y="398" font-weight="bold">$12,000</text>
  <text x="550" y="508" text-anchor="middle" font-size="15" fill="#333">Each grid line is 10×; a sweep moves every bar one decade right. Dashed bar: estimated, not run.</text>
  <text x="550" y="530" text-anchor="middle" font-size="15" fill="#333">Passes are the class budget, not a norm: large corpora usually get 1 to 3, a few hundred examples 3 to 5. Each extra pass adds the same again.</text>
</svg>
