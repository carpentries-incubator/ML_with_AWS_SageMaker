<text x="620.0" y="708" text-anchor="middle" font-size="16" font-style="italic">If in doubt, Bedrock: its worst case is a slightly higher per-token bill. The worst case in the two right-hand columns is a four-figure invoice.</text>
<text x="620.0" y="734" text-anchor="middle" font-size="14" fill="#555">Processing jobs are the safe way to use a GPU: the instance terminates itself. Prices: SageMaker on-demand, October 2026.</text>
