<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- S3 -->
  <rect x="330" y="30" width="300" height="120" rx="8" fill="#fff4e0" stroke="#d9931f" stroke-width="2"/>
  <text x="480" y="55" text-anchor="middle" font-weight="bold" font-size="16">Amazon S3 (storage)</text>
  <rect x="345" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#d9931f"/>
  <text x="410" y="92" text-anchor="middle" font-weight="bold">Your bucket</text>
  <text x="410" y="110" text-anchor="middle" font-size="12">data you upload,</text>
  <text x="410" y="125" text-anchor="middle" font-size="12">every job's outputs</text>
  <rect x="485" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#d9931f"/>
  <text x="550" y="92" text-anchor="middle" font-weight="bold">Shared bucket</text>
  <text x="550" y="110" text-anchor="middle" font-size="12">read-only datasets</text>
  <text x="550" y="125" text-anchor="middle" font-size="12">staged by instructors</text>

  <!-- Notebook instance (controller) -->
  <rect x="40" y="220" width="220" height="130" rx="8" fill="#e8f0fe" stroke="#2f6fcf" stroke-width="2"/>
  <text x="150" y="245" text-anchor="middle" font-weight="bold" font-size="16">Notebook instance</text>
  <text x="150" y="265" text-anchor="middle" font-size="13">(the controller)</text>
  <text x="150" y="290" text-anchor="middle" font-size="12">ml.t3.medium, $0.05/h</text>
  <text x="150" y="308" text-anchor="middle" font-size="12">JupyterLab + SageMaker SDK</text>
  <text x="150" y="326" text-anchor="middle" font-size="12">role = your identity</text>
  <text x="150" y="344" text-anchor="middle" font-size="12">you stop it when you leave</text>

  <!-- SageMaker jobs -->
  <rect x="330" y="200" width="300" height="200" rx="8" fill="#e9f7ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="480" y="225" text-anchor="middle" font-weight="bold" font-size="16">SageMaker jobs</text>
  <text x="480" y="243" text-anchor="middle" font-size="12">instance starts for the job, ends on its own</text>
  <rect x="345" y="258" width="270" height="38" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="480" y="275" text-anchor="middle" font-weight="bold" font-size="13">Training job</text>
  <text x="480" y="290" text-anchor="middle" font-size="11">XGBoost, PyTorch, LoRA fine-tune</text>
  <rect x="345" y="304" width="270" height="38" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="480" y="321" text-anchor="middle" font-weight="bold" font-size="13">Hyperparameter tuning job</text>
  <text x="480" y="336" text-anchor="middle" font-size="11">runs many training jobs in parallel</text>
  <rect x="345" y="350" width="270" height="38" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="480" y="367" text-anchor="middle" font-weight="bold" font-size="13">Processing job</text>
  <text x="480" y="382" text-anchor="middle" font-size="11">embedding, RAG with a self-hosted model</text>

  <!-- Bedrock -->
  <rect x="700" y="220" width="220" height="130" rx="8" fill="#f3e8fd" stroke="#7a3fb5" stroke-width="2"/>
  <text x="810" y="245" text-anchor="middle" font-weight="bold" font-size="16">Amazon Bedrock</text>
  <text x="810" y="265" text-anchor="middle" font-size="13">(hosted models, API)</text>
  <text x="810" y="290" text-anchor="middle" font-size="12">embeddings + generation</text>
  <text x="810" y="308" text-anchor="middle" font-size="12">billed per token</text>
  <text x="810" y="326" text-anchor="middle" font-size="12">nothing to start or stop</text>
  <text x="810" y="344" text-anchor="middle" font-size="12">only the models in the catalog</text>

  <!-- Arrows -->
  <!-- notebook -> S3 -->
  <line x1="200" y1="220" x2="345" y2="134" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="165" font-size="12" fill="#333">upload, read</text>
  <!-- notebook -> jobs -->
  <line x1="260" y1="285" x2="330" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="295" y="275" text-anchor="middle" font-size="12" fill="#333">launch</text>
  <text x="295" y="302" text-anchor="middle" font-size="10" fill="#333">script, instance,</text>
  <text x="295" y="314" text-anchor="middle" font-size="10" fill="#333">tags, max_run</text>
  <!-- jobs <-> S3 -->
  <line x1="480" y1="200" x2="480" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="150" x2="500" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="178" font-size="12" fill="#333">read inputs, write outputs</text>
  <!-- notebook -> Bedrock (route under jobs) -->
  <path d="M150,350 L150,440 L810,440 L810,350" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="432" text-anchor="middle" font-size="12" fill="#333">API call per request (embed, generate)</text>

  <!-- Billing legend -->
  <text x="40" y="490" font-size="12" fill="#333"><tspan font-weight="bold">Billing:</tspan> notebook and jobs per second while running; Bedrock per token; S3 per GB-month. Tags on every one of them.</text>
</svg>
